[build]
  command = "npm install"

# Netlify Functions (Node runtime) - replaces legacy Edge Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Synchronous function timeout limit: up to 26s on Pro/Enterprise plans, 10s on free Hobby plan.
# Uploading attachments (OSS PUT + status polling) takes longer, so keep maximum headroom.
[[functions]]
  path = "api.js"
  timeout = 26

# Rewrite API and page routes to the Functions entry point
[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

# The /chat page is served by the function (core.js falls back to the inlined copy
# bundled in chat-html.js when disk reads fail, so serverless environments work seamlessly)
[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/api/chat"
  status = 200
  force = true

[[redirects]]
  from = "/chat/*"
  to = "/.netlify/functions/api/chat/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200
  force = true

