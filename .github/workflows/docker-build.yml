# Build Docker image and push to GitHub Container Registry (ghcr.io)
# Triggers:
#   1. Code pushed to master / main branch
#   2. Manually triggered on the GitHub Actions page (workflow_dispatch)
name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [master, main]
    # Skip build when only documentation changes
    paths-ignore:
      - 'README.md'
      - 'README_ZH.md'
      - '**.md'
  workflow_dispatch:

# Run only one build per branch at a time; newer pushes cancel in-progress builds
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions: read code, write packages (required for GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build is tagged with `latest` by default, plus branch/tag/SHA tags such as:
      #   ghcr.io/smanx/qwen2api:latest
      #   ghcr.io/smanx/qwen2api:master
      #   ghcr.io/smanx/qwen2api:sha-<7-char-sha>
      #   ghcr.io/smanx/qwen2api:<semver>    (when pushing a tag like v1.2.3)
      # Note: The `sha-` prefix ensures `latest` sorts first on the GitHub Packages page.
      - name: Extract Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build for both amd64 and arm64 (QEMU + Buildx configured above)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up repeated builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

